services:
  - type: web
    name: homescout-buyer-finder
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: PROSPEO_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
